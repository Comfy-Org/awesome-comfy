name: Lint

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  awesome-lint:
    name: awesome-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npx --yes awesome-lint

  links:
    name: Links
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Check every link
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --include-verbatim
            --max-concurrency 8
            --max-retries 3
            --timeout 30
            --accept 200..=299,429
            '*.md'
          fail: ${{ github.event_name != 'schedule' }}
          output: lychee/out.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Open an issue for a scheduled failure
        if: github.event_name == 'schedule' && env.lychee_exit_code != '0'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Dead links in the list
          content-filepath: lychee/out.md
          labels: report
